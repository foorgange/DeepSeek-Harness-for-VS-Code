name: Sync to Gitee

on:
  push:
    branches: [''**'']
    tags: [''**'']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-gitee
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository to Gitee
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: snowfoootball
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repository.git
          cd repository.git
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${REPOSITORY_NAME}.git"
          git push --mirror gitee